name: Apple CI

on:
  push:
    branches: [main]
    paths:
      - 'apple/**'
      - 'openapi.yaml'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'apple/**'
      - 'openapi.yaml'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/apple.yml'

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: SwiftLint & SwiftFormat
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # swiftlint/swiftformat are provided by the .#apple devshell
      # (darwin-only, see flake.nix).

      - name: SwiftLint
        run: nix develop .#apple --command bash -c 'cd "$GITHUB_WORKSPACE/apple" && swiftlint lint --strict --reporter github-actions-logging'

      - name: SwiftFormat (lint)
        run: nix develop .#apple --command bash -c 'cd "$GITHUB_WORKSPACE/apple" && swiftformat --lint .'

  build-test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and simulator inventory
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -m 3 iPhone

      # Local packages (PhotonicCore, PhotonicAPI) carry their own tests.
      - name: Swift package tests
        run: |
          cd apple/Packages/PhotonicCore && swift test
          cd ../PhotonicAPI && swift test

      - name: Build app
        run: |
          xcodebuild \
            -project apple/Photonic.xcodeproj \
            -scheme Photonic \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            build

      # Includes ArchitectureTests (R1-R13 enforcement).
      - name: Run unit tests
        run: |
          xcodebuild \
            -project apple/Photonic.xcodeproj \
            -scheme Photonic \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -only-testing:PhotonicTests \
            test
