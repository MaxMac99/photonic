name: Apple CI

on:
  push:
    branches: [main]
    paths:
      - 'apple/**'
      - 'openapi.yaml'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'apple/**'
      - 'openapi.yaml'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/apple.yml'

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: SwiftLint & SwiftFormat
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # swiftlint/swiftformat are provided by the .#apple devshell
      # (darwin-only, see flake.nix).

      - name: SwiftLint
        run: nix develop .#apple --command bash -c 'cd "$GITHUB_WORKSPACE/apple" && swiftlint lint --strict --reporter github-actions-logging'

      - name: SwiftFormat (lint)
        run: nix develop .#apple --command bash -c 'cd "$GITHUB_WORKSPACE/apple" && swiftformat --lint .'
